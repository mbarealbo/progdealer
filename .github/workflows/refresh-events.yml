name: Refresh events (Firecrawl)

# Scrapes prog listings via Firecrawl and upserts them into Supabase.
# Runs on the 1st and 16th of every month (~every 15 days) at 06:00 UTC,
# and can be triggered manually (with an optional dry run).

on:
  schedule:
    - cron: '0 6 1,16 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (scrape only, no DB write)'
        type: boolean
        default: false

# Avoid overlapping runs.
concurrency:
  group: refresh-events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Scrape & import events
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPED_STATUS: approved
        run: node scripts/scrape-events.mjs ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
